name: Library CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-form-library-and-demo
          path: |
            dist/
            demo-dist/
            .artifacts/*.tgz
          include-hidden-files: true
