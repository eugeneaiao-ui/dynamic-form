name: Library CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm run build:site
      - run: npm run check:site
      - uses: actions/upload-artifact@v4
        with:
          name: formino-library-and-demo
          path: |
            dist/
            demo-dist/
            .artifacts/*.tgz
          include-hidden-files: true
