# 1. 工作流名称（在 GitHub 仓库的 Actions 页面显示）
name: 自动部署项目

# 2. 触发条件：什么时候执行这个工作流（关键！）
on:
  push:  # 推送代码时触发
    branches: [ main ] 
  # 可选：手动触发（在 GitHub 页面点击“Run workflow”）
  workflow_dispatch:

# 3. 定义任务（Jobs）
jobs:
  # 任务 1：部署到服务器（Job 名称可自定义）
  deploy-to-server:
    # 运行环境：GitHub 提供的免费虚拟机（可选 Ubuntu/macOS/Windows）
    runs-on: ubuntu-latest

    # 4. 任务的步骤（Step）
    steps:
      # Step 1：拉取 GitHub 仓库代码（GitHub 官方 Action，无需修改）
      - name: 拉取代码
        uses: actions/checkout@v4  # 调用官方 Action，v4 是版本号

      # Step 2：执行自定义命令（如安装依赖、打包代码，根据项目类型修改）
      - name: 安装依赖并打包
        run: |  # 多行命令用 | 分隔
          npm install  # 安装前端依赖（若为 Java 项目，改为 mvn install）
          npm run build  # 打包前端（生成 dist 目录）

      # Step 3：通过 SSH 连接服务器，同步文件并启动服务（核心部署步骤）
      - name: 部署到 Linux 服务器
        uses: appleboy/ssh-action@master  # 调用第三方 SSH Action（无需自己写 SSH 连接逻辑）
        with:
          # 服务器信息（替换为你的实际信息）
          host: ${{ secrets.SERVER_IP }}  # 服务器 IP（存放在 GitHub Secrets 中，下文讲）
          username: ${{ secrets.SERVER_USER }}  # 服务器 SSH 用户名（如 root）
          key: ${{ secrets.SERVER_SSH_KEY }}  # 服务器 SSH 私钥（推荐，比密码安全）
          # password: ${{ secrets.SERVER_PASSWORD }}  # 若用密码登录，替换上面的 key 为 password
          
          # 部署命令（同步文件+重启服务，根据项目类型修改）
          script: |
            # 进入服务器目标目录（提前创建，如 /usr/local/your-project）
            cd /usr/local/your-project
            # 删除旧文件（避免缓存）
            rm -rf *
            # 从 GitHub 虚拟机同步打包后的文件（dist 目录是本地打包结果）
            scp -r ${{ github.workspace }}/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/usr/local/your-project
            # 重启服务（如 Nginx，根据你的服务修改）
            nginx -s reload